; Builds the bridge firmware for the Module Gateway H2 (ESP32-H2-MINI-1-N2, 2 MB flash):
;     pio run -d h2_firmware/TiltaBridgeH2
; tools/build_release.sh builds it and merges it into TiltaBridgeH2.bin, which the CoreS3 firmware
; carries and the web installer offers. The H2 needs arduino-esp32 3.x, i.e. the pioarduino platform.
[platformio]
src_dir = .

[env:gateway-h2]
platform = espressif32
board = esp32-h2-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 2MB
monitor_speed = 115200
