; Build the environment matching your controller; the firmware then detects the board at runtime
; and picks its pin layout (see BOARD_SELECTION in src/Config.h to force one).
[platformio]
default_envs = m5stack-core2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DUSE_SD_CRC=1
    -DSPI_DRIVER_SELECT=3
lib_deps =
    m5stack/M5Unified
    greiman/SdFat@2.3.1
; The lens names to use when the SD card has no list of its own, built into the firmware (see src/Config.h).
board_build.embed_txtfiles = lenses.txt

[env:m5stack-core2]
board = m5stack-core2

[env:m5stack-cores3]
board = m5stack-cores3
; The CoreS3 carries the H2's bridge firmware and installs it on the stacked H2 when the H2 runs another
; build (src/BridgeUpdate.h). tools/build_release.sh rebuilds TiltaBridgeH2.bin after bridge changes.
board_build.embed_files = h2_firmware/TiltaBridgeH2/TiltaBridgeH2.bin
build_flags =
    ${env.build_flags}
    -DMAGICFOCUS_H2_IMAGE=1
